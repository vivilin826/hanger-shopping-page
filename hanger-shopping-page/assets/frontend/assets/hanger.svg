      <path d="M28 165C102 163 134 168 207 164C270 161 324 168 393 163" stroke="#8C603E" stroke-opacity=".2" stroke-width=".7"/>
      <path d="M75 126C108 116 136 107 161 99M274 104C300 114 335 127 365 136" stroke="#FBE2BF" stroke-opacity=".3" stroke-width=".65"/>
