<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180" fill="none">
  <defs>
    <linearGradient id="wood" x1="210" y1="94" x2="210" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2C69F"/>
      <stop offset=".2" stop-color="#D3B187"/>
      <stop offset=".64" stop-color="#BF976B"/>
      <stop offset="1" stop-color="#A67C53"/>
    </linearGradient>
    <linearGradient id="chrome" x1="185" y1="20" x2="225" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#96958C"/>
      <stop offset=".18" stop-color="#FAFAF2"/>
      <stop offset=".38" stop-color="#AAA99F"/>
      <stop offset=".55" stop-color="#F2F2EA"/>
      <stop offset=".78" stop-color="#74786F"/>
      <stop offset="1" stop-color="#D5D7CD"/>
    </linearGradient>
    <linearGradient id="clip" x1="121" y1="146" x2="149" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#87877E"/>
      <stop offset=".12" stop-color="#D1D2C7"/>
      <stop offset=".31" stop-color="#F1F2E9"/>
      <stop offset=".59" stop-color="#C3C5B9"/>
      <stop offset=".83" stop-color="#A7AA9F"/>
      <stop offset="1" stop-color="#797D72"/>
    </linearGradient>
    <linearGradient id="stem" x1="132" y1="120" x2="138" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#92968B"/>
      <stop offset=".45" stop-color="#F2F3E9"/>
      <stop offset="1" stop-color="#999D91"/>
    </linearGradient>
    <linearGradient id="jaw" x1="135" y1="164" x2="135" y2="175" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73766B"/>
      <stop offset="1" stop-color="#454B40"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-10%" width="124%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#4E483A" flood-opacity=".17"/>
    </filter>
    <clipPath id="woodClip">
      <rect x="78" y="94" width="264" height="24" rx="9"/>
    </clipPath>
    <g id="clamp">
      <!-- A narrow loop embraces the crossbar and carries the spring clip. -->
      <rect x="131.8" y="94.5" width="6.4" height="40" rx="3.2" fill="url(#stem)"/>
      <path d="M133.2 96V131" stroke="#FFFFFF" stroke-opacity=".68" stroke-width=".8" stroke-linecap="round"/>
      <path d="M129 96C128 93 130 91 135 91C140 91 142 93 141 96" stroke="#A5A89B" stroke-width="2" stroke-linecap="round"/>
      <!-- Back jaw remains visible as a thin offset behind the face. -->
      <path d="M126 130C126 127 128 125 131 125H143C146 125 148 127 148 131L150 168C150 171 148 173 145 173H129C126 173 124 171 124 168L126 130Z" fill="#909589"/>
      <path d="M124 130C124 127 126 125 129 125H141C144 125 146 127 146 130L148 167C148 170 146 172 143 172H127C124 172 122 170 122 167L124 130Z" fill="url(#clip)" stroke="#83877A" stroke-opacity=".48" stroke-width=".7"/>
      <!-- A small rounded spring pivot and restrained pressed-metal details. -->
      <rect x="126" y="131" width="18" height="3.5" rx="1.75" fill="#898D81" fill-opacity=".55"/>
      <rect x="127" y="131" width="16" height="1.2" rx=".6" fill="#F8F9F0" fill-opacity=".6"/>
      <path d="M127 139L125.7 161M143 139L144.2 161" stroke="#F7F8ED" stroke-opacity=".62" stroke-width=".7" stroke-linecap="round"/>
      <path d="M132 144H138M132 147H138M132 150H138" stroke="#959A8E" stroke-opacity=".6" stroke-width=".8" stroke-linecap="round"/>
      <!-- Rubber-faced gripping edge overlaps the garment, rather than floats. -->
      <path d="M122.7 164.5H147.3L147.7 170.8C147.8 173.3 146.4 175 144.2 175H125.8C123.6 175 122.2 173.3 122.3 170.8L122.7 164.5Z" fill="url(#jaw)"/>
      <path d="M124 166H146" stroke="#A2A79A" stroke-opacity=".6" stroke-width=".7" stroke-linecap="round"/>
      <path d="M126 173H144" stroke="#353B31" stroke-opacity=".65" stroke-width=".75" stroke-linecap="round"/>
    </g>
  </defs>

  <path d="M210 105V55C210 45 218 42 223 35C232 24 227 8 215 6C202 3 188 12 188 25" stroke="#65675F" stroke-opacity=".28" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M210 105V55C210 45 218 42 223 35C232 24 227 8 215 6C202 3 188 12 188 25" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round"/>
  <path d="M209 103V55C209 44 217 40 222 34C230 24 226 10 215 8C203 5 190 13 190 24" stroke="#FFFFFF" stroke-opacity=".66" stroke-width=".9" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="78" y="94" width="264" height="24" rx="9" fill="url(#wood)"/>
    <g clip-path="url(#woodClip)" stroke-linecap="round">
      <path d="M76 100C123 97 156 103 208 100C252 97 296 103 345 100" stroke="#8C623F" stroke-opacity=".15" stroke-width=".65"/>
      <path d="M77 104C131 101 161 107 210 104C261 102 294 107 345 104" stroke="#F3D6B0" stroke-opacity=".35" stroke-width=".8"/>
      <path d="M77 110C132 107 172 113 224 109C268 107 300 112 345 109" stroke="#96704C" stroke-opacity=".17" stroke-width=".65"/>
      <path d="M79 114C120 111 160 116 203 113C251 111 298 116 342 113" stroke="#F6D5AD" stroke-opacity=".2" stroke-width=".6"/>
    </g>
    <path d="M87 96H333" stroke="#F7DFC0" stroke-opacity=".62" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M87 116H333" stroke="#815E3F" stroke-opacity=".3" stroke-width="1" stroke-linecap="round"/>
    <use href="#clamp"/>
    <use href="#clamp" transform="translate(150 0)"/>
  </g>
</svg>
