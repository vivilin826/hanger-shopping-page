<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Hanger · 手机样机预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#353b30;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;background-image:radial-gradient(ellipse at 50% 35%,#faf8f3,transparent 70%)}header{text-align:center;padding:25px 20px 16px}header small{font-size:10px;letter-spacing:4px;color:#858a79}h1{font-family:Georgia,serif;font-size:25px;font-weight:400;margin:9px 0}header p{font-size:12px;color:#818477;margin:0}main{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 24px 30px}.space{position:relative}.phone{position:absolute;top:0;left:0;width:418px;height:892px;border-radius:65px;background:linear-gradient(115deg,#777771,#181917 8%,#42453f 52%,#11120f 93%,#85877c);padding:13px;box-shadow:0 35px 65px #39372c35,0 7px 15px #39372c25,inset 0 0 0 2px #9d9e93,inset 0 0 0 5px #262923;transform-origin:top left}.screen{position:relative;width:392px;height:866px;background:#f2f0e8;border:1px solid #111;border-radius:52px;overflow:hidden}.status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:8px 27px 0;font-size:13px;font-weight:600;color:#353b30;background:#f1efe8}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#111310;border-radius:20px;z-index:5}.camera{position:absolute;right:11px;top:9px;width:9px;height:9px;background:radial-gradient(circle,#273c4d,#101a24 60%);border:1px solid #252e32;border-radius:50%}.signals{font-size:11px;letter-spacing:1px}iframe{border:0;display:block;width:390px;height:824px;background:#f1efe8}.home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:5px;background:#242822;pointer-events:none}.button{position:absolute;width:4px;background:#4d5148;border-radius:3px;left:-3px;top:163px;height:58px}.button.two{top:235px}.button.power{left:auto;right:-3px;top:210px;height:85px}footer{padding:0 16px 20px;font-size:11px;color:#828676;text-align:center}a{color:inherit;text-underline-offset:4px}button{border:1px solid #c8cbbf;background:#f8f6f0;color:#515847;border-radius:20px;padding:7px 15px;font:inherit;cursor:pointer;margin-left:12px}@media(max-width:500px){header{padding-top:16px}h1{font-size:21px}main{padding:8px 15px 22px}footer{padding-bottom:12px}}

<main><div class="space" id="space"><div class="phone" id="phone"><i class="button"></i><i class="button two"></i><i class="button power"></i><div class="screen"><div class="status"><span>9:41</span><span class="signals">▂▄▆ ▰</span></div><div class="island"><span class="camera"></span></div><iframe id="preview" title="衣架购物单页第二版手机预览" src="mobile.html"></iframe><div class="home"></div></div></div></div></main>

<script>
const main=document.querySelector('main'),phone=document.getElementById('phone'),space=document.getElementById('space');
function fit(){const r=main.getBoundingClientRect(),scale=Math.max(.15,Math.min(1,(r.width-48)/418,(r.height-42)/892));phone.style.transform=`scale(${scale})`;space.style.width=418*scale+'px';space.style.height=892*scale+'px'}
new ResizeObserver(fit).observe(main);window.addEventListener('resize',fit);fit();document.getElementById('reload').onclick=()=>{document.getElementById('preview').src='mobile.html'};
</script></body></html>
